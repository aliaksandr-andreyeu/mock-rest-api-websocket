services:
  mock-api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      WS_TICK_MS: ${WS_TICK_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
