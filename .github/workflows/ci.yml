name: CI Checks

on:
  push:
    branches:
      - development
      - testing
      - staging
      - main
  pull_request:
    branches:
      - development
      - testing
      - staging
      - main

jobs:
  checks:
    name: ✅ Checks (format/lint/build/test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Format (check)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
