name: PR Checks

on:
  pull_request:
    branches:
      - development
      - testing
      - staging
      - main

jobs:
  checks:
    name: ✅ Checks (format/lint/build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Format (check)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
